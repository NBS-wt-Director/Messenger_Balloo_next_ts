<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal — Вход</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --primary: #2563EB; --secondary: #7C3AED; --bg: #0F172A;
      --surface: #1E293B; --text-primary: #F8FAFC; --text-secondary: #94A3B8;
      --border: #334155; --error: #EF4444;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-container {
      width: 100%;
      max-width: 420px;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 40px;
    }
    .logo {
      text-align: center;
      margin-bottom: 32px;
    }
    .logo-icon {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
    }
    .logo-title { font-size: 28px; font-weight: 700; }
    .logo-subtitle { color: var(--text-secondary); font-size: 14px; margin-top: 4px; }
    .admin-badge {
      display: inline-block;
      background: rgba(245, 158, 11, 0.2);
      color: #F59E0B;
      padding: 4px 12px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      margin-top: 8px;
    }
    .form-group { margin-bottom: 20px; }
    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text-secondary);
    }
    .form-input {
      width: 100%;
      padding: 12px 16px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text-primary);
      font-size: 14px;
      outline: none;
    }
    .form-input:focus { border-color: var(--primary); }
    .submit-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      border: none;
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    .submit-btn:hover { opacity: 0.9; }
    .forgot-link {
      display: block;
      text-align: center;
      margin-top: 16px;
      color: var(--text-secondary);
      font-size: 13px;
      text-decoration: none;
    }
    .forgot-link:hover { color: var(--primary); }
    .warning-box {
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid rgba(245, 158, 11, 0.3);
      padding: 16px;
      margin-top: 24px;
      font-size: 12px;
      color: var(--text-secondary);
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="logo">
      <div class="logo-icon">🛡️</div>
      <div class="logo-title">Balloo Admin</div>
      <div class="logo-subtitle">Панель администратора</div>
      <div class="admin-badge">Доступ только для персонала</div>
    </div>

    <form onsubmit="event.preventDefault(); alert('Вход выполнен!'); window.location.href='admin_dashboard.html';">
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" class="form-input" placeholder="admin@balloo.su" required>
      </div>

      <div class="form-group">
        <label class="form-label">Пароль</label>
        <input type="password" class="form-input" placeholder="••••••••" required>
      </div>

      <div class="form-group">
        <label class="form-label">2FA код (если включён)</label>
        <input type="text" class="form-input" placeholder="123456" maxlength="6">
      </div>

      <button type="submit" class="submit-btn">Войти</button>
    </form>

    <a href="#" class="forgot-link">Забыли пароль?</a>

    <div class="warning-box">
      ⚠️ Несанкционированный доступ к панели администратора<br>запрещён и преследуется по закону
    </div>
  </div>
</body>
</html>
