<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Balloo — Просмотр статуса</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --primary: #2563EB; --secondary: #7C3AED; --bg: #000000;
      --text-primary: #F8FAFC; --text-secondary: #94A3B8;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      height: 100vh;
      overflow: hidden;
    }
    .status-container {
      position: relative;
      width: 100%;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1e3a8a, #7c3aed);
    }
    .status-content {
      text-align: center;
      font-size: 24px;
    }
    .status-image {
      max-width: 100%;
      max-height: 80vh;
      object-fit: contain;
    }
    .placeholder {
      font-size: 120px;
    }
    
    .progress-bar {
      position: absolute;
      top: 20px;
      left: 20px;
      right: 20px;
      display: flex;
      gap: 4px;
      z-index: 10;
    }
    .progress-segment {
      flex: 1;
      height: 4px;
      background: rgba(255,255,255,0.3);
    }
    .progress-segment.active {
      background: white;
      animation: progress 5s linear;
    }
    .progress-segment.watched {
      background: white;
    }
    @keyframes progress {
      from { opacity: 0.3; }
      to { opacity: 1; }
    }
    
    .header {
      position: absolute;
      top: 40px;
      left: 0;
      right: 0;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }
    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .user-avatar {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      clip-path: polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%);
    }
    .user-name { font-weight: 600; }
    .status-time { font-size: 12px; color: var(--text-secondary); }
    
    .close-btn {
      background: rgba(0,0,0,0.5);
      border: none;
      color: white;
      width: 40px;
      height: 40px;
      cursor: pointer;
      font-size: 24px;
    }
    
    .actions {
      position: absolute;
      bottom: 40px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 40px;
      z-index: 10;
    }
    .action-btn {
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      width: 56px;
      height: 56px;
      cursor: pointer;
      font-size: 28px;
      backdrop-filter: blur(10px);
    }
    .action-btn:hover { background: rgba(255,255,255,0.3); }
    
    .side-nav {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 30%;
      z-index: 5;
    }
    .side-nav.prev { left: 0; }
    .side-nav.next { right: 0; }
    .side-nav:hover { background: rgba(255,255,255,0.05); }
  </style>
</head>
<body>
  <div class="progress-bar">
    <div class="progress-segment watched"></div>
    <div class="progress-segment active"></div>
    <div class="progress-segment"></div>
  </div>

  <div class="header">
    <div class="user-info">
      <div class="user-avatar">АИ</div>
      <div>
        <div class="user-name">Алексей Иванов</div>
        <div class="status-time">сегодня, 14:30</div>
      </div>
    </div>
    <button class="close-btn" onclick="window.location.href='statuses.html'">×</button>
  </div>

  <div class="side-nav prev" onclick="prevStatus()"></div>
  <div class="side-nav next" onclick="nextStatus()"></div>

  <div class="status-container">
    <div class="status-content">
      <div class="placeholder">📷</div>
      <p style="margin-top: 20px; color: var(--text-secondary);">Фото статуса</p>
    </div>
  </div>

  <div class="actions">
    <button class="action-btn" onclick="alert('Ответить...')">💬</button>
    <button class="action-btn" onclick="alert('Поделиться...')">↗️</button>
    <button class="action-btn" onclick="alert('Нравится...')">❤️</button>
    <button class="action-btn" onclick="alert('Ещё...')">⋮</button>
  </div>

  <script>
    let currentStatus = 1;
    const totalStatuses = 3;

    function nextStatus() {
      if (currentStatus < totalStatuses) {
        currentStatus++;
        updateProgress();
      } else {
        window.location.href = 'statuses.html';
      }
    }

    function prevStatus() {
      if (currentStatus > 1) {
        currentStatus--;
        updateProgress();
      }
    }

    function updateProgress() {
      const segments = document.querySelectorAll('.progress-segment');
      segments.forEach((seg, i) => {
        seg.classList.remove('active', 'watched');
        if (i < currentStatus - 1) seg.classList.add('watched');
        if (i === currentStatus - 1) seg.classList.add('active');
      });
    }

    // Автопереключение через 5 секунд
    setInterval(() => {
      const activeSegment = document.querySelector('.progress-segment.active');
      if (activeSegment) {
        nextStatus();
      }
    }, 5000);

    // Закрытие по Escape
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') window.location.href = 'statuses.html';
      if (e.key === 'ArrowRight') nextStatus();
      if (e.key === 'ArrowLeft') prevStatus();
    });
  </script>
</body>
</html>
