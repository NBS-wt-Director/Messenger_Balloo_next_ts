<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Balloo — 404</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #2563EB;
      --secondary: #7C3AED;
      --bg: #0F172A;
      --surface: #1E293B;
      --text-primary: #F8FAFC;
      --text-secondary: #94A3B8;
      --border: #334155;
      --error: #EF4444;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* === HEADER (Единый) === */
    .header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 20px;
      height: 64px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }

    .header-logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-logo-img {
      width: 40px;
      height: 40px;
      background: var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: var(--text-secondary);
      text-align: center;
    }

    .header-mascot {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      clip-path: polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%);
    }

    .header-title {
      font-size: 18px;
      font-weight: 700;
    }

    .header-nav {
      display: flex;
      gap: 8px;
      margin-left: 24px;
    }

    .header-nav-item {
      padding: 8px 12px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-secondary);
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .header-nav-item:hover {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .header-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-avatar {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 600;
      clip-path: polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%);
    }

    /* === MAIN CONTENT === */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      text-align: center;
    }

    .error-code {
      font-size: 120px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--error), var(--primary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      margin-bottom: 16px;
    }

    .error-title {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .error-message {
      font-size: 16px;
      color: var(--text-secondary);
      margin-bottom: 32px;
      max-width: 400px;
    }

    .error-actions {
      display: flex;
      gap: 12px;
    }

    .btn {
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn.primary {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      border: none;
      color: white;
    }

    .btn.secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-primary);
    }

    /* === FOOTER (Единый) === */
    .footer {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .footer-logo {
      width: 40px;
      height: 40px;
      background: var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      color: var(--text-secondary);
      text-align: center;
    }

    .footer-company {
      flex: 1;
      margin-left: 16px;
    }

    .footer-company-name {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .footer-company-info {
      font-size: 11px;
      color: var(--text-secondary);
    }

    .footer-links {
      display: flex;
      gap: 16px;
    }

    .footer-link {
      font-size: 12px;
      color: var(--text-secondary);
      text-decoration: none;
      cursor: pointer;
    }

    .footer-link:hover {
      color: var(--primary);
    }

    .footer-version {
      font-size: 11px;
      color: var(--text-secondary);
    }

    /* === BRUTALISM === */
    /* border-radius: 0 everywhere */

  </style>
</head>
<body>
  <!-- HEADER (Единый для всех экранов) -->
  <header class="header">
    <div class="header-logo">
      <!-- ЛОГО ПРОДУКТА (PNG) -->
      <div class="header-logo-img">
        <img src="/assets/logo-product.png" alt="Balloo" style="display:none;">
        <span>LOGO</span>
      </div>
      <!-- МАСКОТ "БАЛУНИШКА БОРИС" (PNG) -->
      <div class="header-mascot">
        <img src="/assets/mascot-boris.png" alt="Борис" style="display:none;">
        🐻
      </div>
    </div>
    <div class="header-title">Balloo</div>
    <nav class="header-nav">
      <button class="header-nav-item">Главная</button>
      <button class="header-nav-item">Загрузки</button>
      <button class="header-nav-item">О нас</button>
    </nav>
    <div class="header-right">
      <div class="header-avatar">?</div>
    </div>
  </header>

  <!-- MAIN CONTENT (Error 404) -->
  <div class="main-content">
    <div class="error-code">404</div>
    <div class="error-title">Страница не найдена</div>
    <div class="error-message">
      Запрашиваемая страница не существует или была удалена. Проверьте URL и попробуйте снова.
    </div>
    <div class="error-actions">
      <button class="btn primary" onclick="window.history.back()">← Назад</button>
      <button class="btn secondary" onclick="window.location.href='/'">На главную</button>
    </div>
  </div>

  <!-- FOOTER (Единый для всех экранов) -->
  <footer class="footer">
    <div style="display:flex;align-items:center;gap:16px;">
      <!-- ЛОГО КОМПАНИИ (PNG) -->
      <div class="footer-logo">
        <img src="/assets/logo-company.png" alt="Компания" style="display:none;">
        <span>LOGO</span>
      </div>
      <div class="footer-company">
        <div class="footer-company-name">NBS — web-tech</div>
        <div class="footer-company-info">Системы для Ваших Новых Начинаний. Екатеринбург</div>
      </div>
    </div>
    <div class="footer-links">
      <a href="#" class="footer-link">downloads</a>
      <a href="#" class="footer-link">aboutBalloo</a>
      <a href="#" class="footer-link">aboutCompany</a>
      <a href="#" class="footer-link">features</a>
      <a href="#" class="footer-link">support</a>
      <a href="#" class="footer-link">terms</a>
      <a href="#" class="footer-link">privacy</a>
    </div>
    <div class="footer-version">v1.0.0</div>
  </footer>
</body>
</html>
