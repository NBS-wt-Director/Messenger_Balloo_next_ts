<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Balloo — Регистрация</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --primary: #2563EB; --secondary: #7C3AED; --bg: #0F172A;
      --surface: #1E293B; --text-primary: #F8FAFC; --text-secondary: #94A3B8;
      --border: #334155; --success: #10B981; --error: #EF4444;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .register-container {
      width: 100%;
      max-width: 420px;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 40px;
    }
    .logo {
      text-align: center;
      margin-bottom: 32px;
    }
    .logo-icon {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
    }
    .logo-title {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .logo-subtitle {
      color: var(--text-secondary);
      font-size: 14px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text-secondary);
    }
    .form-input {
      width: 100%;
      padding: 12px 16px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text-primary);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-input:focus {
      border-color: var(--primary);
    }
    .form-input.error {
      border-color: var(--error);
    }
    .error-message {
      color: var(--error);
      font-size: 12px;
      margin-top: 4px;
      display: none;
    }
    .form-input.error + .error-message {
      display: block;
    }
    .password-strength {
      margin-top: 8px;
    }
    .strength-bar {
      height: 4px;
      background: var(--border);
      margin-bottom: 4px;
    }
    .strength-fill {
      height: 100%;
      width: 0%;
      background: var(--error);
      transition: all 0.3s;
    }
    .strength-fill.weak { width: 33%; background: var(--error); }
    .strength-fill.medium { width: 66%; background: var(--warning); }
    .strength-fill.strong { width: 100%; background: var(--success); }
    .strength-text {
      font-size: 11px;
      color: var(--text-secondary);
    }
    .submit-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      border: none;
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
      margin-top: 8px;
    }
    .submit-btn:hover {
      opacity: 0.9;
    }
    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .divider {
      display: flex;
      align-items: center;
      margin: 24px 0;
      color: var(--text-secondary);
      font-size: 12px;
    }
    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .divider span {
      padding: 0 12px;
    }
    .oauth-btn {
      width: 100%;
      padding: 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text-primary);
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: background 0.2s;
    }
    .oauth-btn:hover {
      background: rgba(255,255,255,0.05);
    }
    .oauth-icon {
      width: 20px;
      height: 20px;
      background: #FC0;
    }
    .login-link {
      text-align: center;
      margin-top: 24px;
      color: var(--text-secondary);
      font-size: 13px;
    }
    .login-link a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }
    .login-link a:hover {
      text-decoration: underline;
    }
    .terms-check {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 20px;
    }
    .terms-check input {
      margin-top: 2px;
    }
    .terms-check label {
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.4;
    }
    .terms-check a {
      color: var(--primary);
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="register-container">
    <div class="logo">
      <div class="logo-icon">🐻</div>
      <div class="logo-title">Balloo</div>
      <div class="logo-subtitle">Переверни общение</div>
    </div>

    <form id="registerForm">
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" class="form-input" placeholder="your@email.com" required>
        <div class="error-message">Введите корректный email</div>
      </div>

      <div class="form-group">
        <label class="form-label">Телефон (необязательно)</label>
        <input type="tel" class="form-input" placeholder="+7 (999) 000-00-00">
        <div class="error-message">Введите корректный номер</div>
      </div>

      <div class="form-group">
        <label class="form-label">Имя пользователя</label>
        <input type="text" class="form-input" placeholder="@username" required>
        <div class="error-message">Имя должно быть от 3 до 20 символов</div>
      </div>

      <div class="form-group">
        <label class="form-label">Пароль</label>
        <input type="password" class="form-input" placeholder="Минимум 8 символов" required minlength="8">
        <div class="password-strength">
          <div class="strength-bar">
            <div class="strength-fill" id="strengthFill"></div>
          </div>
          <div class="strength-text" id="strengthText">Слабый пароль</div>
        </div>
        <div class="error-message">Пароль должен содержать минимум 8 символов</div>
      </div>

      <div class="terms-check">
        <input type="checkbox" id="terms" required>
        <label for="terms">
          Я согласен с <a href="terms.html">Пользовательским соглашением</a> и 
          <a href="privacy.html">Политикой конфиденциальности</a>
        </label>
      </div>

      <button type="submit" class="submit-btn">Создать аккаунт</button>
    </form>

    <div class="divider">
      <span>или через</span>
    </div>

    <button class="oauth-btn">
      <div class="oauth-icon">Y</div>
      Продолжить с Yandex ID
    </button>

    <div class="login-link">
      Уже есть аккаунт? <a href="auth_screen.html">Войти</a>
    </div>
  </div>

  <script>
    const passwordInput = document.querySelector('input[type="password"]');
    const strengthFill = document.getElementById('strengthFill');
    const strengthText = document.getElementById('strengthText');

    passwordInput.addEventListener('input', (e) => {
      const value = e.target.value;
      let strength = 0;
      
      if (value.length >= 8) strength++;
      if (value.match(/[a-z]/) && value.match(/[A-Z]/)) strength++;
      if (value.match(/[0-9]/)) strength++;
      if (value.match(/[^a-zA-Z0-9]/)) strength++;

      strengthFill.className = 'strength-fill';
      if (strength <= 1) {
        strengthFill.classList.add('weak');
        strengthText.textContent = 'Слабый пароль';
      } else if (strength <= 2) {
        strengthFill.classList.add('medium');
        strengthText.textContent = 'Средний пароль';
      } else {
        strengthFill.classList.add('strong');
        strengthText.textContent = 'Надёжный пароль';
      }
    });

    document.getElementById('registerForm').addEventListener('submit', (e) => {
      e.preventDefault();
      alert('Регистрация успешна! Переход к верификации...');
      window.location.href = 'verify_code.html';
    });
  </script>
</body>
</html>
