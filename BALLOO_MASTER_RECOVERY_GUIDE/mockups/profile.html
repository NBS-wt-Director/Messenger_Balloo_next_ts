<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Balloo — Профиль</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --primary: #2563EB; --secondary: #7C3AED; --bg: #0F172A;
      --surface: #1E293B; --text-primary: #F8FAFC; --text-secondary: #94A3B8;
      --border: #334155; --error: #EF4444;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
    }
    .header {
      height: 64px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 16px;
    }
    .back-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 20px;
      cursor: pointer;
    }
    .page-title { font-size: 18px; font-weight: 700; }
    
    .profile-container {
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px;
    }
    .avatar-section {
      text-align: center;
      margin-bottom: 32px;
    }
    .avatar-large {
      width: 120px;
      height: 120px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      font-weight: 700;
      clip-path: polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%);
      cursor: pointer;
      position: relative;
    }
    .avatar-large:hover::after {
      content: '📷';
      position: absolute;
      font-size: 32px;
      background: rgba(0,0,0,0.7);
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .change-avatar-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-secondary);
      padding: 8px 16px;
      cursor: pointer;
      font-size: 13px;
    }
    .change-avatar-btn:hover {
      background: var(--bg);
      color: var(--text-primary);
    }
    .form-section {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 24px;
      margin-bottom: 20px;
    }
    .section-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text-secondary);
    }
    .form-input {
      width: 100%;
      padding: 12px 16px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text-primary);
      font-size: 14px;
      outline: none;
    }
    .form-input:focus { border-color: var(--primary); }
    .form-input[readonly] {
      background: rgba(51, 65, 85, 0.3);
      cursor: not-allowed;
    }
    .form-textarea {
      min-height: 100px;
      resize: vertical;
    }
    .helper-text {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 4px;
    }
    .save-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      border: none;
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 20px;
    }
    .save-btn:hover { opacity: 0.9; }
    .avatar-history {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
      margin-top: 16px;
    }
    .avatar-thumb {
      width: 60px;
      height: 60px;
      background: var(--bg);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      cursor: pointer;
      clip-path: polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%);
    }
    .avatar-thumb:hover { border-color: var(--primary); }
  </style>
</head>
<body>
  <header class="header">
    <button class="back-btn" onclick="window.location.href='settings_screen.html'">←</button>
    <h1 class="page-title">Профиль</h1>
  </header>

  <div class="profile-container">
    <div class="avatar-section">
      <div class="avatar-large">АИ</div>
      <button class="change-avatar-btn">Изменить аватар</button>
      
      <div class="form-group" style="margin-top: 24px;">
        <label class="form-label">История аватаров</label>
        <div class="avatar-history">
          <div class="avatar-thumb">🐻</div>
          <div class="avatar-thumb">🦊</div>
          <div class="avatar-thumb">🐺</div>
          <div class="avatar-thumb">🦁</div>
          <div class="avatar-thumb">🐯</div>
        </div>
      </div>
    </div>

    <div class="form-section">
      <h2 class="section-title">Основная информация</h2>
      
      <div class="form-group">
        <label class="form-label">Имя пользователя</label>
        <input type="text" class="form-input" value="@alexivanov" placeholder="@username">
        <div class="helper-text">От 3 до 20 символов, только латиница</div>
      </div>

      <div class="form-group">
        <label class="form-label">О себе</label>
        <textarea class="form-input form-textarea" placeholder="Расскажите немного о себе...">Разработчик Balloo Platform</textarea>
        <div class="helper-text">Максимум 200 символов</div>
      </div>
    </div>

    <div class="form-section">
      <h2 class="section-title">Контакты</h2>
      
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" class="form-input" value="alex@balloo.app" readonly>
        <div class="helper-text">Для изменения обратитесь в поддержку</div>
      </div>

      <div class="form-group">
        <label class="form-label">Телефон</label>
        <input type="tel" class="form-input" value="+7 (999) 000-00-00" placeholder="+7 (___) ___-__-__">
      </div>
    </div>

    <div class="form-section">
      <h2 class="section-title">Дополнительно</h2>
      
      <div class="form-group">
        <label class="form-label">Язык</label>
        <select class="form-input">
          <option value="ru">Русский</option>
          <option value="en">English</option>
          <option value="de">Deutsch</option>
          <option value="fr">Français</option>
          <option value="ja">日本語</option>
          <option value="zh">中文</option>
          <option value="hi">हिन्दी</option>
          <option value="ar">العربية</option>
          <option value="be">Беларуская</option>
          <option value="tt">Татарский</option>
          <option value="ba">Башкирский</option>
          <option value="cv">Чувашский</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Часовой пояс</label>
        <select class="form-input">
          <option value="UTC+5">Екатеринбург (UTC+5)</option>
          <option value="UTC+3">Москва (UTC+3)</option>
          <option value="UTC+0">London (UTC+0)</option>
          <option value="UTC-8">Los Angeles (UTC-8)</option>
        </select>
      </div>
    </div>

    <button class="save-btn" onclick="alert('Профиль сохранён!')">Сохранить изменения</button>
  </div>
</body>
</html>
