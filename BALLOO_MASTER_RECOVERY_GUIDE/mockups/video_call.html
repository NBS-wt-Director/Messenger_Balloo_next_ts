<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Balloo — Видеозвонок</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --primary: #2563EB; --secondary: #7C3AED; --bg: #0F172A;
      --surface: #1E293B; --text-primary: #F8FAFC; --text-secondary: #94A3B8;
      --border: #334155; --error: #EF4444; --success: #10B981;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: #000;
      color: var(--text-primary);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .call-header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, transparent 100%);
      z-index: 10;
    }
    .caller-info {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .caller-avatar {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 700;
      clip-path: polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%);
    }
    .caller-name { font-size: 20px; font-weight: 700; }
    .call-status { font-size: 14px; color: var(--text-secondary); }
    .call-timer {
      font-size: 16px;
      font-weight: 600;
      background: rgba(0,0,0,0.5);
      padding: 8px 16px;
    }
    
    .video-container {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .remote-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #1a1a1a;
    }
    .local-video {
      position: absolute;
      bottom: 140px;
      right: 20px;
      width: 160px;
      height: 120px;
      background: #1a1a1a;
      border: 2px solid var(--border);
      z-index: 5;
    }
    .video-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      font-size: 48px;
    }
    
    .call-controls {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 16px;
      z-index: 10;
    }
    .control-btn {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      transition: all 0.2s;
    }
    .control-btn.secondary {
      background: rgba(255,255,255,0.2);
      color: white;
    }
    .control-btn.secondary:hover {
      background: rgba(255,255,255,0.3);
    }
    .control-btn.secondary.active {
      background: white;
      color: black;
    }
    .control-btn.danger {
      background: var(--error);
      color: white;
      width: 72px;
      height: 72px;
      font-size: 32px;
    }
    .control-btn.danger:hover {
      background: #dc2626;
    }
    .control-label {
      position: absolute;
      bottom: -24px;
      font-size: 11px;
      color: var(--text-secondary);
      white-space: nowrap;
    }
    
    .call-actions {
      position: absolute;
      top: 100px;
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 10;
    }
    .action-btn {
      width: 48px;
      height: 48px;
      background: rgba(0,0,0,0.5);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      transition: all 0.2s;
    }
    .action-btn:hover {
      background: rgba(255,255,255,0.1);
      color: var(--text-primary);
    }
    .action-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
    }
  </style>
</head>
<body>
  <div class="call-header">
    <div class="caller-info">
      <div class="caller-avatar">АИ</div>
      <div>
        <div class="caller-name">Алексей Иванов</div>
        <div class="call-status">Видеозвонок</div>
      </div>
    </div>
    <div class="call-timer" id="callTimer">00:00</div>
  </div>

  <div class="video-container">
    <div class="remote-video">
      <div class="video-placeholder">📹</div>
    </div>
    <div class="local-video">
      <div class="video-placeholder">👤</div>
    </div>
  </div>

  <div class="call-actions">
    <button class="action-btn" title="Перевернуть камеру" onclick="this.classList.toggle('active')">🔄</button>
    <button class="action-btn" title="Эффекты" onclick="alert('Эффекты')">✨</button>
    <button class="action-btn" title="Показать участников" onclick="alert('Участники')">👥</button>
    <button class="action-btn" title="Чат" onclick="alert('Чат звонка')">💬</button>
  </div>

  <div class="call-controls">
    <button class="control-btn secondary" onclick="this.classList.toggle('active')" title="Микрофон">
      🎤
      <span class="control-label">Микрофон</span>
    </button>
    <button class="control-btn secondary active" onclick="this.classList.toggle('active')" title="Камера">
      📹
      <span class="control-label">Камера</span>
    </button>
    <button class="control-btn secondary" onclick="alert('Демонстрация экрана')" title="Демонстрация">
      🖥️
      <span class="control-label">Демонстрация</span>
    </button>
    <button class="control-btn danger" onclick="endCall()" title="Завершить">
      📞
      <span class="control-label">Завершить</span>
    </button>
  </div>

  <script>
    let seconds = 0;
    const timer = setInterval(() => {
      seconds++;
      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;
      document.getElementById('callTimer').textContent = 
        `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }, 1000);

    function endCall() {
      clearInterval(timer);
      if (confirm('Завершить звонок?')) {
        alert('Звонок завершён');
        window.location.href = 'chat_list.html';
      }
    }
  </script>
</body>
</html>
