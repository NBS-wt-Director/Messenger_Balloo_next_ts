name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  IMAGE_NAME_API: ${{ github.repository }}/api
  IMAGE_NAME_ADMIN: ${{ github.repository }}/admin-portal
  IMAGE_NAME_MESSENGER: ${{ github.repository }}/messenger

jobs:
  # Lint and Type Check
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [api, admin-portal, messenger]
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: |
          cd ${{ matrix.package }}
          npm ci
      
      - name: Run linting
        run: |
          cd ${{ matrix.package }}
          npm run lint
      
      - name: Type check
        run: |
          cd ${{ matrix.package }}
          npm run typecheck

  # Test
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [api, messenger]
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: |
          cd ${{ matrix.package }}
          npm ci
      
      - name: Run tests
        run: |
          cd ${{ matrix.package }}
          npm test

  # Build
  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    strategy:
      matrix:
        package: [api, admin-portal, messenger]
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: |
          cd ${{ matrix.package }}
          npm ci
      
      - name: Build
        run: |
          cd ${{ matrix.package }}
          npm run build

  # Docker Build and Push
  docker:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    strategy:
      matrix:
        package: [api, admin-portal, messenger]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_${{ upper(matrix.package) }} }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.package }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
