version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-balloo}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-balloo_production}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - balloo-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-balloo} -d ${DB_NAME:-balloo_production}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - balloo-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # API Service
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=postgresql://${DB_USER:-balloo}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-balloo_production}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - balloo-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  # Admin Portal
  admin-portal:
    build:
      context: ./admin-portal
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - PORT=3002
    depends_on:
      - api
    networks:
      - balloo-network
    restart: unless-stopped

  # Messenger
  messenger:
    build:
      context: ./messenger
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - PORT=3000
    depends_on:
      - api
    networks:
      - balloo-network
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/configs/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - admin-portal
      - messenger
    networks:
      - balloo-network
    restart: unless-stopped

volumes:
  pgdata:
  redis-data:

networks:
  balloo-network:
    driver: bridge
