<svg width="200" height="60" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <!-- Balloo Logo -->
  <defs>
    <linearGradient id="balloonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e94560;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff6b6b;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Balloon -->
  <ellipse cx="50" cy="35" rx="30" ry="25" fill="url(#balloonGradient)" />
  <ellipse cx="45" cy="30" rx="8" ry="10" fill="rgba(255,255,255,0.3)" />
  
  <!-- String -->
  <path d="M 50 60 Q 50 50 50 45" stroke="#e94560" stroke-width="2" fill="none" />
  
  <!-- Text -->
  <text x="90" y="35" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#e94560">
    BALLOO
  </text>
  <text x="90" y="50" font-family="Arial, sans-serif" font-size="10" fill="#666">
    PLATFORM v2.0.0
  </text>
</svg>
