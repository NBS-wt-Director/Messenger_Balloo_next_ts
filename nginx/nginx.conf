events {
    worker_connections 1024;
}

http {
    upstream api {
        server api:3001;
    }

    upstream messenger {
        server messenger:3000;
    }

    upstream admin-portal {
        server admin-portal:3002;
    }

    upstream max-server {
        server max-server:8080;
    }

    # =============================================
    # API Server (API + WebSocket)
    # =============================================
    server {
        listen 80;
        server_name api.balloo.ru localhost;

        # API routes
        location /api/ {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 90;
        }

        # WebSocket
        location /ws {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }

        # Health check
        location /health {
            proxy_pass http://api;
            proxy_set_header Host $host;
        }
    }

    # =============================================
    # Messenger (Web App)
    # =============================================
    server {
        listen 80;
        server_name app.balloo.ru messenger.balloo.ru localhost;

        location / {
            proxy_pass http://messenger;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # =============================================
    # Admin Portal
    # =============================================
    server {
        listen 80;
        server_name admin.balloo.ru localhost;

        location / {
            proxy_pass http://admin-portal;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # =============================================
    # Max SMS Server
    # =============================================
    server {
        listen 80;
        server_name max.balloo.ru;

        location / {
            proxy_pass http://max-server;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # =============================================
    # Development: direct access by port
    # =============================================
    # API: localhost:3001
    # Messenger: localhost:3000
    # Admin: localhost:3002
    # Max Server: localhost:8080
}
