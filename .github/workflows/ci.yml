name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, feature/*]
  pull_request:
    branches: [main, develop]

jobs:
  # ============================================
  # BACKEND API
  # ============================================
  api-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./api
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: api/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Check syntax
        run: node -c src/index.js && node -c src/routes/index.js
      
      - name: Lint
        run: npm run lint 2>/dev/null || echo "Lint not configured"
      
      - name: Security audit
        run: npm audit --audit-level=moderate

  api-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./api
    needs: api-lint
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: api/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run tests
        run: npm test 2>/dev/null || echo "Tests not configured"
      
      - name: Run smoke tests
        run: node tests/smoke/smoke-test.js || echo "Smoke tests skipped"

  # ============================================
  # FRONTEND
  # ============================================
  frontend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./messenger
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: messenger/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Type check
        run: npm run typecheck
      
      - name: Lint
        run: npm run lint 2>/dev/null || echo "Lint not configured"
      
      - name: Build
        run: npm run build

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./messenger
    needs: frontend-lint
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: messenger/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run tests
        run: npm test 2>/dev/null || echo "Tests not configured"

  # ============================================
  # DOCKER BUILD
  # ============================================
  docker-build:
    runs-on: ubuntu-latest
    needs: [api-lint, frontend-lint]
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Build API
        uses: docker/build-push-action@v4
        with:
          context: ./api
          push: false
          tags: balloo-api:latest
      
      - name: Build Max Server
        uses: docker/build-push-action@v4
        with:
          context: ./max-server
          push: false
          tags: balloo-max:latest

  # ============================================
  # DOCKER COMPOSE VALIDATION
  # ============================================
  docker-compose-validate:
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Docker Compose
        run: docker-compose --version
      
      - name: Validate docker-compose.yml
        run: docker-compose config
      
      - name: Validate docker-compose.full.yml
        run: docker-compose -f docker-compose.full.yml config || echo "Full compose validation skipped"

  # ============================================
  # DEPLOY (only on main branch)
  # ============================================
  deploy:
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v3
      
      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/balloo
            docker-compose pull
            docker-compose up -d
            docker system prune -f
